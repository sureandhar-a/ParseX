# Nightly hardening (manual + scheduled): fuzz smoke + slow resource checks.
# Kept out of the per-PR pipeline to keep PR feedback fast. Fuzzing needs
# Clang with the runtime; slow checks are bounded but take minutes.
name: Nightly hardening
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
jobs:
  fuzz-and-slow:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh
      - name: Configure with fuzzing
        run: cmake -S . -B build/fuzz -DCMAKE_CXX_COMPILER=clang++ -DPARSEX_ENABLE_FUZZING=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build fuzz targets
        run: cmake --build build/fuzz --parallel
      - name: Fuzz smoke
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build/fuzz --output-on-failure -L hardening_fuzz
      - name: Slow resource checks
        run: ctest --test-dir build/fuzz --output-on-failure -L hardening_slow
