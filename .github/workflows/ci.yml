name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    env:
        VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        # Persisted binary cache for compiled vcpkg ports (see the
        # "Cache vcpkg binary archives" step): configure becomes downloads
        # instead of from-source compiles. NOTE: the 'x-gha' backend must NOT
        # be used — this repo's vcpkg removed it (configure warns loudly and
        # then compiles everything from source).
        VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-archives,readwrite"
    strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
        - uses: actions/checkout@v5
          with:
            submodules: recursive
        - name: Cache vcpkg binary archives
          uses: actions/cache@v5
          with:
            # Compiled-port archives written by the files backend above.
            # Deliberately NOT caching vcpkg/ (tool repo) or
            # build/vcpkg_installed/ (installed tree): a stale tool checkout
            # skews the toolchain version and makes vcpkg reject the cached
            # tree, rebuilding everything. Archives are ABI-addressed by
            # vcpkg itself, so a stale entry can only ever cause a rebuild,
            # never a wrong binary.
            path: ${{ github.workspace }}/vcpkg-archives
            key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
            restore-keys: |
              vcpkg-archives-${{ runner.os }}-
        - name: Bootstrap vcpkg (Unix)
          if: runner.os != 'Windows'
          run: ./vcpkg/bootstrap-vcpkg.sh

        - name: Bootstrap vcpkg (Windows)
          if: runner.os == 'Windows'
          run: ./vcpkg/bootstrap-vcpkg.bat

        - name: Install Build Tools (Linux)
          if: runner.os == 'Linux'
          run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy

        - name: Configure (Unix)
          if: runner.os != 'Windows'
          run: cmake --preset default

        - name: Configure (Windows)
          if: runner.os == 'Windows'
          run: cmake --preset default -DVCPKG_TARGET_TRIPLET=x64-mingw-static
        - name: Build
          run: cmake --build build/debug --parallel
        - name: Test
          run: ctest --test-dir build/debug --output-on-failure
        - name: Contract hardening
          run: ctest --test-dir build/debug --output-on-failure -L hardening_contract

        - name: Configure with sanitizers
          if: runner.os != 'Windows'
          run: cmake --preset build-asan

        - name: Build with sanitizers
          if: runner.os != 'Windows'
          run: cmake --build build/asan --parallel

        - name: Test (Linux — full ASan+UBSan+LSan)
          if: runner.os == 'Linux'
          run: ctest --test-dir build/asan --output-on-failure

        - name: Test (macOS — ASan+UBSan only, leak detection unreliable on Apple Silicon)
          if: runner.os == 'macOS'
          env:
            ASAN_OPTIONS: detect_leaks=0
          run: ctest --test-dir build/asan --output-on-failure

  clang-tidy:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-archives,readwrite"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy ninja-build

      - name: Cache vcpkg binary archives
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/vcpkg-archives
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure (export compile commands)
        run: cmake --preset default -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          find libparsex parsex-cli parsex-mcp -name '*.cpp' | xargs -P "$(nproc)" -I{} \
            clang-tidy -p build/debug {} --warnings-as-errors='*'